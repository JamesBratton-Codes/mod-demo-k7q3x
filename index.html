<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Math Over Myth</title>
  <meta name="description" content="Math Over Myth breaks down claims with real numbers.">
  <meta name="theme-color" content="#12171f">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="config.js"></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <div class="glow glow--top" aria-hidden="true"></div>
  <div class="glow glow--bottom" aria-hidden="true"></div>

  <div class="page">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Home">
        <img class="brand__logo" data-bind="logo" alt="" width="32" height="32">
        <span class="brand__name" data-text="brand"></span>
      </a>
      <ul class="socials socials--header" data-socials aria-label="Social links"></ul>
    </header>

    <main class="hero">
      <section class="hero__copy">
        <p class="eyebrow"><span data-text="eyebrow"></span> <em data-text="eyebrowAccent"></em></p>
        <h1 class="headline" data-headline></h1>
        <p class="tagline" data-text="tagline"></p>
        <div class="actions">
          <a class="btn btn--primary" data-cta></a>
          <a class="btn btn--ghost" data-cta2></a>
        </div>
      </section>

      <section class="hero__visual" aria-label="Sample trading chart">
        <article class="terminal" data-terminal>
          <header class="terminal__head">
            <div class="ticker">
              <span class="ticker__badge" data-hc="tickerLabel"></span>
              <span class="ticker__status"><i class="pulse"></i><span data-hc="status"></span></span>
            </div>
            <div class="quote">
              <strong class="quote__price" data-hc="price"></strong>
              <span class="pill" data-hc="change"></span>
            </div>
          </header>
          <div class="chart" data-chart></div>
          <ul class="stats" data-stats></ul>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <ul class="socials socials--footer" data-socials aria-label="Social links"></ul>
      <p data-footer></p>
    </footer>
  </div>

  <noscript><p style="text-align:center;padding:1rem;color:#fff">Please enable JavaScript to view this page.</p></noscript>
</body>
</html>
